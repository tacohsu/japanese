<style>
:root{
  --paper:#FBFAF6; --paper2:#F1F0E7; --card:#FFFFFF;
  --ink:#1B2521; --ink2:#5A655E; --ink3:#8C968F;
  --rule:#C3D3C4; --ruleS:#7FA285;
  --seal:#B23A2B; --indigo:#2C4A6E;
  --ok:#3F7D58; --warn:#B8860B; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#141A17;--paper2:#1B2320;--card:#1F2825;--ink:#E8EDE9;--ink2:#9CA9A2;--ink3:#6B776F;
    --rule:#33463A;--ruleS:#5C8266;--seal:#D6604D;--indigo:#7FA8D6;--ok:#6FBF8E;--warn:#D6A93A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Hiragino Sans","Noto Sans TC","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:84px}
.jp{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-feature-settings:"palt"}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 0}
h1{font-size:19px;font-weight:600;margin:0 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:600;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

.genko{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:10px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.genko i{aspect-ratio:1;border:1px solid var(--rule);border-radius:2px;display:block;transition:background .25s}
.genko i.f{background:var(--ruleS);border-color:var(--ruleS)}
.genko i.n{background:var(--seal);border-color:var(--seal)}
.stat{display:flex;gap:20px;margin:14px 0 4px;align-items:baseline}
.stat b{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);display:block;margin-top:-4px}
.cta{display:block;width:100%;padding:15px;background:var(--indigo);color:#fff;border-radius:var(--r);
  font-size:16px;font-weight:600;margin:18px 0 6px;text-align:center}
.cta.done{background:var(--paper2);color:var(--ink2)}
.cta2{display:block;width:100%;padding:12px;border:1px solid var(--rule);border-radius:var(--r);
  font-size:14px;margin:8px 0;background:var(--card);text-align:center}

.study{padding:16px;max-width:600px;margin:0 auto}
.qbar{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:14px}
.face{background:var(--card);border:1px solid var(--rule);border-radius:14px;min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px 26px;
  text-align:center;position:relative}
.face .tag{position:absolute;top:10px;left:14px;font-size:11px;color:var(--ink3)}
.big{font-size:76px;line-height:1.1}
.mid{font-size:28px;line-height:1.4;font-weight:500}
.small{font-size:18px;line-height:1.6}
.ans{border-top:1px dashed var(--rule);margin-top:18px;padding-top:16px;width:100%}
.romaji{font-size:22px;color:var(--indigo);letter-spacing:.06em;font-weight:600}
.hint{font-size:13px;color:var(--ink2);margin-top:8px}
.spk{margin-top:14px;padding:7px 16px;border:1px solid var(--rule);border-radius:99px;
  font-size:13px;color:var(--ink2);background:var(--paper)}
.tip{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.opts button{padding:14px 12px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--card);font-size:16px;text-align:center}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{border-color:var(--seal);color:var(--seal)}
.opts button.dim{opacity:.4}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grades button{padding:14px 4px;border-radius:var(--r);font-size:14px;font-weight:600;border:1px solid var(--rule)}
.g0{background:var(--card);color:var(--seal)}
.g1{background:var(--card);color:var(--warn)}
.g2{background:var(--ok);color:#fff;border-color:var(--ok)}
.reveal{margin-top:14px;padding:15px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--rule);width:100%;font-weight:600;text-align:center}

.kt{display:grid;gap:4px}
.kt div{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 2px;text-align:center;line-height:1.25}
.kt div.mix{border-color:var(--seal);border-width:1.5px}
.kt b{font-size:21px;font-weight:400;display:block}
.kt s{font-size:11px;color:var(--ink3);text-decoration:none;display:block}
.kt em{font-size:10px;color:var(--indigo);font-style:normal;display:block;letter-spacing:.04em}

.row{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%}
.row .l{min-width:0;flex:1}
.row .t{font-size:16px;font-weight:500}
.row .d{font-size:12px;color:var(--ink2);margin-top:1px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--paper2);color:var(--ink2);
  white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--ok);color:#fff}
.pill.mid{background:var(--warn);color:#fff}
.pill.nx{background:var(--indigo);color:#fff}

.gcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:10px}
.gcard .p{font-size:18px;font-weight:600;margin-bottom:5px}
.gcard .n{font-size:13px;color:var(--ink2);margin-bottom:10px}
.gcard .e{border-left:2px solid var(--ruleS);padding-left:11px;margin-top:9px;font-size:14px}
.gcard .e i{display:block;font-style:normal;color:var(--ink2);font-size:12.5px;margin-top:2px}

.unit{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.uhead{display:flex;align-items:center;gap:10px;padding:11px 13px;width:100%;text-align:left}
.uno{font-size:12px;color:var(--indigo);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:30px}
.utitle{flex:1;font-size:15px;min-width:0}
.chk{width:22px;height:22px;border:1.5px solid var(--rule);border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;background:var(--paper)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ubody{padding:0 13px 12px;border-top:1px solid var(--paper2)}
.pat{font-size:13px;color:var(--ink2);padding:10px 0;border-bottom:1px solid var(--paper2)}
.ph{padding:9px 0;border-bottom:1px solid var(--paper2)}
.ph:last-child{border:none}
.ph .z{font-size:12.5px;color:var(--ink2)}
.ph .j{font-size:16.5px;margin-top:1px}
.ph .k{font-size:12px;color:var(--indigo)}

.bars{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.bar{margin-bottom:13px}.bar:last-child{margin:0}
.bar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .h span{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12px}
.track{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ruleS);border-radius:99px;transition:width .4s}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--rule);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;padding:11px 2px 9px;font-size:11px;color:var(--ink3);text-align:center;line-height:1.3}
nav button b{display:block;font-size:17px;font-weight:400;margin-bottom:1px;opacity:.55;letter-spacing:-.06em}
nav button b.two{font-size:15px}
nav button.on{color:var(--indigo);font-weight:600}
nav button.on b{opacity:1}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:44px 20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ============ 句子拆解：詞彙索引（含讀音）+ 助詞 + 句尾 ============ */
const LEX={},READ={};
function addLex(k,v,r){if(!k||!v)return;if(!LEX[k])LEX[k]=v;if(r&&r!==k&&!READ[k])READ[k]=r;}

const HIRA_ONLY=x=>!/[^\u3041-\u309F]/.test(x);

/* ---- 動詞變化生成 ---- */
const IROW={"き":"く","ぎ":"ぐ","し":"す","ち":"つ","に":"ぬ","び":"ぶ","み":"む","り":"る","い":"う"};
const TE5={"き":"いて","ぎ":"いで","し":"して","ち":"って","り":"って","い":"って","に":"んで","び":"んで","み":"んで"};
const TA5={"き":"いた","ぎ":"いだ","し":"した","ち":"った","り":"った","い":"った","に":"んだ","び":"んだ","み":"んだ"};
const AROW={"き":"か","ぎ":"が","し":"さ","ち":"た","に":"な","び":"ば","み":"ま","り":"ら","い":"わ"};
const EROW={"き":"け","ぎ":"げ","し":"せ","ち":"て","に":"ね","び":"べ","み":"め","り":"れ","い":"え"};
const EROW_SET="えけげせぜてでねへべぺめれ";
const ICHI={"みます":1,"できます":1,"おります":1,"います":1,"かります":1,"すぎます":1,"おきます":1};

function vkind(kana){
  if(kana==="します")return "suru";
  if(kana==="きます")return "kuru";
  if(/します$/.test(kana)&&kana.length>3)return "nsuru";
  const st=kana.slice(0,-2),last=st.slice(-1);
  if(EROW_SET.indexOf(last)>=0||ICHI[kana])return "ichi";
  return IROW[last]?"godan":"";
}
/* 同一個 kind 下，假名版與漢字版產出的形式順序一致，才能配對成讀音 */
function vforms(form,kind){
  const st=form.slice(0,-2),last=st.slice(-1),cut=st.slice(0,-1);
  const base=[form,st+"ません",st+"ました",st+"ませんでした",st+"ましょう",st+"たい",st+"たいです",st+"たかった"];
  if(kind==="suru")return base.concat(["する","して","した","しない","できる","したい"]);
  if(kind==="kuru")return base.concat([form[0]==="来"?"来る":"くる",form[0]==="来"?"来て":"きて",
    form[0]==="来"?"来た":"きた",form[0]==="来"?"来ない":"こない"]);
  if(kind==="nsuru"){const n=form.slice(0,-3);
    return base.concat([n+"する",n+"して",n+"した",n+"しない",n+"できる",n+"したい"]);}
  if(kind==="ichi")return base.concat(["る","て","た","ない","なかった","られる","られます","られません",
    "られました","れば","ている","ています","そう"].map(t=>st+t));
  if(kind==="godan"){
    const iku=/行き$|いき$/.test(st);
    return base.concat([cut+IROW[last],cut+(iku?"って":TE5[last]),cut+(iku?"った":TA5[last]),
      cut+AROW[last]+"ない",cut+AROW[last]+"なかった",cut+EROW[last]+"る",cut+EROW[last]+"ます",
      cut+EROW[last]+"ば",cut+(iku?"っている":TE5[last]+"いる")]);
  }
  return base;
}
function addVerb(kana,kanji,mean){
  const k=vkind(kana); if(!k)return;
  const A=vforms(kana,k), B=kanji?vforms(kanji,k):null;
  A.forEach(f=>addLex(f,mean));
  if(B)B.forEach((f,i)=>addLex(f,mean,A[i]));
}
/* ---- い形容詞變化 ---- */
function addAdjI(kana,kanji,mean){
  if(!/い$/.test(kana))return;
  const sufs=[["くない","（否定）"],["くないです","（否定）"],["かった","（過去）"],["かったです","（過去）"],
    ["くなかった","（過去否定）"],["くありません","（否定・鄭重）"],["くて","（接續）"],["く","（副詞化）"],
    ["ければ","（條件形）"],["そう","（看起來…）"],["そうです","（看起來…）"]];
  sufs.forEach(([sf,tag])=>{
    addLex(kana.slice(0,-1)+sf,mean+tag);
    if(kanji)addLex(kanji.slice(0,-1)+sf,mean+tag,kana.slice(0,-1)+sf);
  });
}

  if(/ます$/.test(kana))addVerb(kana,kanji,v[2]);
  else if(v[3]==="形容")addAdjI(kana,kanji,v[2]);
});

  </div>${chips(jp)}`;
}
function breakdown(jp){
  const chunks=jp.split(/[\s、。！？]+/).filter(Boolean);
  const out=[],seen={};
  const add=(k,v)=>{if(k&&v&&!seen[k]){seen[k]=1;out.push([k,v,READ[k]||""]);}};
  for(const raw of chunks){
    const ch=raw.replace(/[〜（）「」]/g,"");
    let i=0,guard=0;
    while(i<ch.length&&guard++<40){
      let hit=null;
      for(let L=Math.min(10,ch.length-i);L>=1;L--){
        const seg=ch.substr(i,L);
        if(!LEX[seg])continue;
        const rest=ch.slice(i+L);
        /* 短的純假名要有理由才採信：整段用完、後面接助詞、後面還接得下去，或本來就是常用短詞 */
        const ok=L>=3||!HIRA_ONLY(seg)||rest===""||PART[rest]||PART[rest[0]]||SHORT[seg]||lexHead(rest);
        if(ok){hit=seg;break;}
      }
      if(hit){add(hit,LEX[hit]);i+=hit.length;continue;}
      let ph=null;
      for(const L of [3,2,1]){const seg=ch.substr(i,L);if(PART[seg]){ph=seg;break;}}
      if(ph){add(ph,PART[ph]);i+=ph.length;continue;}
      i++;
    }
  }
  return {words:out};
}

const PKEYS=["jpprobe","jp_probe","jp-probe","jp:probe"];
let keyFmt=null;
const PROBEKEY="jp:cloudprobe";
async function probeCloud(){
  if(!CLOUD)return;
  try{const c=LOCAL&&LOCAL.get(PROBEKEY);
    if(c==="none"){cloudErr="這個環境不支援雲端寫入（已記住，不再重試）";probeLog=[];return;}
    if(c&&c.indexOf("|")>0){const[ki,vi]=c.split("|");keyFmt=PKEYS[+ki];setVar=SETV[+vi];
      probeLog=["✓ 沿用上次實測結果："+keyFmt+" ＋ "+setVar.n];return;}
  }catch(e){}
  for(const g of GETV){try{await g.f("jpprobe");getVar=g;break;}catch(e){}}
  if(!getVar)getVar=GETV[0];
  const test="1";
  outer:
  for(const pk of PKEYS){
    for(const v of SETV){
      try{
        await v.f(pk,test);
        const got=unwrap(await getVar.f(pk));
        if(got&&got.length){setVar=v;keyFmt=pk;probeLog.push("✓ "+pk+" ＋ "+v.n);
          try{LOCAL&&LOCAL.set(PROBEKEY,PKEYS.indexOf(pk)+"|"+SETV.indexOf(v));}catch(e){}
          break outer;}
        probeLog.push("✗ "+pk+" ＋ "+v.n+"：寫了讀不到");
      }catch(e){probeLog.push("✗ "+pk+" ＋ "+v.n+"："+String((e&&e.message)||e).slice(0,40));}
    }
  }
  if(!setVar){cloudErr="這個環境不支援雲端寫入，改用本機儲存";
    try{LOCAL&&LOCAL.set(PROBEKEY,"none");}catch(e){}}
}

const fmtKey=k=>{
  if(!keyFmt)return k;
  if(keyFmt.indexOf(":")>=0)return k;
  const sep=keyFmt.indexOf("_")>=0?"_":"-";
  return k.split(":").join(sep);
};

async function rawGet(k){
  if(CLOUD){try{const v=unwrap(await (getVar||GETV[0]).f(fmtKey(k)));if(v)return v;}catch(e){}}

async function rawSet(k,v){
  let cloudOK=false,localOK=false;
  if(CLOUD&&setVar){try{await setVar.f(fmtKey(k),v);cloudOK=true;cloudErr="";}
    catch(e){cloudErr=String((e&&e.message)||e);}}
  if(LOCAL){try{LOCAL.set(k,v);localOK=true;localErr="";}
    catch(e){localErr=String((e&&e.message)||e);}}
  backend=cloudOK?(localOK?"Claude 帳號（本機另存一份備援）":"Claude 帳號")
        :(localOK?(CLOUD?"瀏覽器本機（雲端不可用）":"瀏覽器本機"):"");
  if(!cloudOK&&!localOK)throw new Error(cloudErr||localErr||"沒有可用的儲存空間");

}

  const cs="abcdefghijkmnpqrstuvwxyz23456789";let o="";

  (crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256);
  for(let i=0;i<16;i++)o+=cs[a[i]%cs.length];
  return o;
}
async function rpc(fn,body){
  const base=SY.url.replace(/\/+$/,"");
  const r=await fetch(base+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SY.key,Authorization:"Bearer "+SY.key,"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  const txt=await r.text();
  if(!r.ok)throw new Error("HTTP "+r.status+"　"+txt.slice(0,120));
  return txt?JSON.parse(txt):null;
}
/* 逐張卡比對時間戳，兩台裝置各自練過的都保得住，不是整份覆蓋 */
function mergeState(a,b){
  const an=a.mtime||0,bn=b.mtime||0;
  const base=JSON.parse(JSON.stringify(an>=bn?a:b)),other=(an>=bn?b:a);
  const cards={},ids=new Set(Object.keys(a.cards||{}).concat(Object.keys(b.cards||{})));
  ids.forEach(id=>{
    const x=(a.cards||{})[id],y=(b.cards||{})[id];
    if(!x){cards[id]=y;return;}
    if(!y){cards[id]=x;return;}
    const tx=x.t||0,ty=y.t||0;
    cards[id]=tx>ty?x:(ty>tx?y:((x.reps||0)>=(y.reps||0)?x:y));
  });
  base.cards=cards;
  base.done=Object.assign({},other.done||{},base.done||{});
  base.task=Object.assign({},other.task||{},base.task||{});
  base.total=Math.max(a.total||0,b.total||0);
  base.streak=Math.max(a.streak||0,b.streak||0);
  base.mtime=Math.max(an,bn);
  return base;
}
async function syncNow(manual){
  if(!syncOn()||syncBusy)return;
  syncBusy=true;syncMsg="同步中…";if(manual&&!session)render();
  try{
    const rows=await rpc("jp_pull",{p_code:SY.code});
    const remote=(rows&&rows[0]&&rows[0].data)?rows[0].data:null;
    const before=Object.keys(S.cards).length;
    if(remote)S=mergeState(S,remote);
    S.mtime=Date.now();
    await flush();
    await rpc("jp_push",{p_code:SY.code,p_data:S});
    const after=Object.keys(S.cards).length;
    S.syncedAt=new Date().toLocaleString("zh-TW",{hour12:false});
    syncMsg="同步完成　共 "+after+" 張"+(after>before?"（雲端補回 "+(after-before)+" 張）":"");
    await flush();
  }catch(e){const h=netHint(e);
    syncMsg="同步失敗："+String((e&&e.message)||e).slice(0,80)+(h?"\n\n"+h:"");}
  syncBusy=false;if(!session)render();
}

async function load(){

  }else{loadedFrom="沒有找到既有進度（第一次使用會是這樣）";}

  }
}

/* ============ SRS ============ */
const seen=id=>!!S.cards[id];
const isDue=id=>{const c=S.cards[id];return c&&dnum(today())>=c.due;};
const mastery=id=>{const c=S.cards[id];return !c?0:(c.ivl>=21?2:(c.ivl>=1?1:0));};
function grade(id,g){
  let c=S.cards[id]||{ivl:0,ease:2.5,reps:0,lapse:0,due:0};
  if(g===0){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.lapse++;c.reps=0;}
  else if(g===1){c.ivl=c.reps===0?1:Math.max(1,Math.round(c.ivl*1.25));c.ease=Math.max(1.3,c.ease-.15);c.reps++;}
  else{c.ivl=c.reps===0?1:(c.reps===1?3:Math.round(c.ivl*c.ease));c.ease=Math.min(2.8,c.ease+.05);c.reps++;}
  c.due=dnum(today())+Math.max(0,c.ivl);c.t=Date.now();
  S.cards[id]=c;S.total++;S.last=today();S.mtime=Date.now();save();return g===0;
}
function unlockedPhrases(){
  const anyDone=Object.keys(S.done).length>0;
  return DECKS.filter(c=>c.deck==="phrase"&&(!anyDone||UNITS.some(u=>S.done[u.i]&&u.ids.includes(c.id))));
}
function buildQueue(){
  const dueC=DECKS.filter(c=>isDue(c.id));
  const nj=DECKS.filter(c=>!seen(c.id)&&c.track==="jlpt"&&!S.off[c.deck]);
  const up=unlockedPhrases();
  const nt=DECKS.filter(c=>!seen(c.id)&&c.track==="travel"&&!S.off[c.deck]&&(c.deck!=="phrase"||up.includes(c)));
  const room=Math.max(0,S.newPerDay-S.day.newN),fresh=[];
  for(let i=0;fresh.length<room&&(i<nj.length||i<nt.length);i++){
    if(nj[i])fresh.push(nj[i]);
    if(fresh.length<room&&nt[i])fresh.push(nt[i]);
  }
  const q=dueC.concat(fresh);
  for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  return q;
}

let voice=null;
function pv(){const v=speechSynthesis.getVoices().filter(x=>/ja/i.test(x.lang));voice=v[0]||null;}

/* 朗讀前把排版符號洗掉：→ ／ 括號 底線這些唸出來會很怪 */
function sayText(t){
  return String(t)
    .replace(/（[^）]*）/g,"")       /* 括號內多半是中文註解，整段拿掉 */
    .replace(/\([^)]*\)/g,"")
    .replace(/[→⇒]/g,"、")          /* 箭頭改成停頓 */
    .replace(/／/g,"、")
    .replace(/[「」『』［］\[\]【】]/g,"")
    .replace(/_+/g,"")
    .replace(/[▸▶]/g,"")
    .replace(/\s+/g," ")
    .replace(/\s*、\s*/g,"、")     /* 停頓符號前後不留空格 */
    .replace(/^[、\s]+|[、\s]+$/g,"")
    .trim();
}
function say(t,r){
  if(!window.speechSynthesis)return;
  const txt=sayText(t); if(!txt)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";u.rate=r||S.rate;
  if(voice)u.voice=voice;speechSynthesis.speak(u);}

function bars(){

/* --- 假名 --- */
function kt(list,cols){
  return `<div class="kt" style="grid-template-columns:repeat(${cols},1fr)">`+list.map(k=>
   `<div class="${k[3]?"mix":""}" data-say="${k[0]}"><b class="jp">${k[0]}</b>${k[1]?`<s class="jp">${k[1]}</s>`:""}<em>${k[2]}</em></div>`).join("")+"</div>";
}
const isHira=c=>/[\u3041-\u309F]/.test(c);
function vKana(){
  const sub=[["kata","片假名"],["hira","平假名"]];
  return `<div class="wrap" style="padding-bottom:0"><h1>假名</h1>
  <div style="display:flex;gap:6px;margin:12px 0 4px">
  ${sub.map(x=>`<button data-km="${x[0]}" class="pill ${kMode===x[0]?"nx":""}" style="padding:8px 18px;font-size:13px">${x[1]}</button>`).join("")}
  </div></div>`+(kMode==="hira"?vHira():vKata());
}
function vKata(){
  const d=BY.kana.filter(c=>mastery(c.id)===2).length;
  const strip=l=>l.map(k=>[k[0],pair?k[1]:"",k[2],k[3]||0]);
  return `<div class="wrap" style="padding-top:8px">
  <p class="sub">已掌握 ${d}/${BY.kana.length}。紅框是最容易混淆的字，點任一格聽發音</p>
  <button class="cta" data-start="kana">練習片假名</button>
  <button class="cta2" data-start="mixup">易混字挑戰（兩種假名都有）</button>
  <button class="row" data-pair style="margin-top:14px">
    <div class="l"><div class="t">${pair?"對照模式":"純片假名模式"}</div>
    <div class="d">${pair?"每格下方標出對應的平假名":"只顯示片假名，想不起來再切到對照"}</div></div>
    <span class="pill ${pair?"nx":""}">${pair?"關閉對照":"開啟對照"}</span></button>
  <h2>清音</h2>${kt(strip(KANA),5)}
  <h2>濁音・半濁音</h2>${kt(strip(KANA_D),5)}
  <h2>拗音</h2>${kt(strip(KANA_Y),3)}
  <h2>容易搞混的組合</h2>
  ${MIXUP.filter(m=>!isHira(m[0])).map(m=>`<div class="gcard"><div class="p jp">${m[0]} ／ ${m[1]}</div>
    <div class="n" style="margin:0">${m[2]}</div></div>`).join("")}
  <h2>特殊記號</h2>
  <div class="gcard"><div class="p jp">ー</div><div class="n" style="margin:0">長音符號。片假名一律用橫線，不寫母音。コーヒー = ko-hi-i</div></div>
  <div class="gcard"><div class="p jp">ッ</div><div class="n" style="margin:0">小的ツ，促音，停頓一拍。チケット = chi-ke-(停)-to</div></div>
  <h2>旅遊外來語 ${BY.loan.filter(c=>mastery(c.id)>0).length}/${LOAN.length}</h2>
  ${LOAN.map(w=>`<button class="row" data-say="${w[0]}"><div class="l"><div class="t jp">${w[0]}</div>
   <div class="d">${w[2]}　·　${w[1]}</div></div><span class="pill">聽</span></button>`).join("")}</div>`;
}
function vHira(){
  const d=BY.hira.filter(c=>mastery(c.id)===2).length;
  const conv=l=>l.map(k=>[k[1],k[0],k[2],0]);
  return `<div class="wrap" style="padding-top:8px">
  <p class="sub">已掌握 ${d}/${BY.hira.length}。下方小字是對應的片假名</p>

  <h2>清音</h2>${kt(conv(KANA),5)}
  <h2>濁音・半濁音</h2>${kt(conv(KANA_D),5)}
  <h2>拗音</h2>${kt(conv(KANA_Y),3)}
  <h2>容易搞混的組合</h2>
  ${MIXUP.filter(m=>isHira(m[0])).map(m=>`<div class="gcard"><div class="p jp">${m[0]} ／ ${m[1]}</div>

const tag=m=>`<span class="pill ${m===2?"on":(m===1?"mid":"")}">${m===2?"已掌握":(m===1?"複習中":"未學")}</span>`;

  const cats=[...new Set(arr.map(v=>v[3]))];

/* --- 課程 --- */
const U=i=>UNITS.find(u=>u.i===i);
const dayDone=n=>{const p=PLAN[n];return p[0].length?p[0].every(i=>S.done[i]):!!S.task["d"+(n+1)];};
function vCourse(){
  const head=`<div class="wrap" style="padding-bottom:0"><h1>課程進度</h1>
  <div style="display:flex;gap:6px;margin:12px 0 4px">
   <button data-mode="ch" class="pill ${cMode==="ch"?"nx":""}" style="padding:8px 16px;font-size:13px">依章節</button>
   <button data-mode="plan" class="pill ${cMode==="plan"?"nx":""}" style="padding:8px 16px;font-size:13px">60 天計劃</button>
  </div></div>`;
  return head+(cMode==="plan"?vPlan():vChapters());
}
function vPlan(){
  const cur=S.start?Math.min(60,dnum(today())-dnum(S.start)+1):0;
  const fin=PLAN.filter((_,n)=>dayDone(n)).length;
  return `<div class="wrap" style="padding-top:8px">
  <p class="sub">課程附的 60 天進度表。打勾的單元會同步到「依章節」那邊，句子也會進卡片池</p>
  ${S.start?`<div class="stat"><div><b>${cur}</b><span>今天是第幾天</span></div>
    <div><b>${fin}</b><span>已完成天數</span></div>
    <div><b>${60-fin}</b><span>剩餘</span></div></div>
    <button class="cta2" data-startplan>取消計劃起始日（${S.start}）</button>`
   :`<button class="cta" data-startplan>把今天設為第 1 天</button>
     <p class="sub" style="margin-top:10px">設定後會自動算出今天該進行到哪一天。落後了也沒關係，進度以打勾為準</p>`}
  ${PLAN.map((p,n)=>{
    const no=n+1,on=dayDone(n),isCur=cur===no;
    const names=p[0].map(i=>{const u=U(i);return u?i+" "+u.t:i;});
    return `<div class="unit" style="${isCur?"border-color:var(--indigo);border-width:1.5px":""}">
    <div class="uhead" style="align-items:flex-start">
      <span class="uno" style="padding-top:2px">${no}</span>
      <span class="utitle">${names.length?names.map(t=>`<div>${t}</div>`).join(""):`<div style="color:var(--seal)">${p[1]||"自行安排"}</div>`}
      ${names.length&&p[1]?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">${p[1]}</div>`:""}
      ${isCur?`<div style="font-size:11px;color:var(--indigo);margin-top:3px">今天</div>`:""}</span>
      ${p[0].length?`<span class="chk ${on?"on":""}" data-day="${n}">✓</span>`
       :`<span class="chk ${on?"on":""}" data-task="d${no}">✓</span>`}
    </div></div>`;}).join("")}
  <p class="sub" style="margin-top:16px">勾一天等於把那天所有單元標成已看，該單元的句子就會進卡片池。也可以到「依章節」逐課勾</p>
  </div>`;
}

        <div class="l"><div class="t" style="font-size:14px">${t}</div></div>
        <span class="chk ${S.task[k]?"on":""}" style="width:20px;height:20px;font-size:12px">✓</span></button>`;}).join("")}`:""}
      ${u.p.map(p=>`<div class="ph" data-say="${esc(p[1])}"><div class="z">${p[0]}</div>
        <div class="j jp">${p[1]}</div>${p[2]?`<div class="k jp">${p[2]}</div>`:""}</div>`).join("")}
      ${u.p.length?`<button class="cta2" data-start="u:${u.i}" style="margin:12px 0 0">練這個單元的 ${u.p.length} 句</button>`:""}
      </div>`:""}</div>`;}).join("")}
  </div>`;
}

/* --- 搜尋 --- */
const DLABEL={kana:"片假名",hira:"平假名",listen:"聽力",num:"數字量詞",loan:"外來語",
  vocab:"N5 單字",gram:"N5 文法",kanji:"N5 漢字",vocab4:"N4 單字",gram4:"N4 文法",phrase:"課程會話"};
function findHits(q){
  q=q.trim().toLowerCase();
  if(q.length<1)return[];
  const out=[];
  for(const c of DECKS){
    if(c.deck==="listen")continue;
    const hay=[c.front,c.back,c.sub,c.extra].join(" ").toLowerCase();
    if(hay.indexOf(q)>=0){out.push(c);if(out.length>=80)break;}
  }
  return out;
}
function hitsHTML(q){
  const hits=findHits(q);
  if(!q.trim())return `<p class="sub">可以查日文、假名或中文意思。例如「結帳」「ください」「ろっぽん」「二人前」</p>`;
  if(!hits.length)return `<p class="sub">找不到「${esc(q)}」。這 ${DECKS.filter(c=>c.deck!=="listen").length} 張卡裡沒有收錄，需要的話跟我說可以補</p>`;
  return `<p class="sub">${hits.length}${hits.length>=80?"+":""} 筆</p>`+hits.map(c=>{
    const m=mastery(c.id);
    return `<button class="row" ${c.speak?`data-say="${esc(c.speak)}"`:""}>
      <div class="l"><div class="t jp">${esc(c.front)}</div>
      <div class="d">${esc(c.back)}${c.sub?"　"+esc(c.sub):""}</div>
      <div class="d" style="color:var(--ink3)">${DLABEL[c.deck]||c.deck}${c.extra?"　"+esc(c.extra):""}</div></div>
      ${tag(m)}</button>`;}).join("");
}
function vFind(){
  return `<div class="wrap"><h1>搜尋</h1>
  <input id="fq" value="${esc(fq)}" placeholder="輸入日文或中文" autocomplete="off"
    style="width:100%;padding:13px;margin:12px 0 6px;border:1px solid var(--rule);border-radius:var(--r);
    background:var(--card);color:var(--ink);font-size:16px">
  <div id="fres">${hitsHTML(fq)}</div></div>`;
}

/* --- 學習 --- */
function startSession(kind){
  let q;
  if(kind==="all")q=buildQueue();
  else if(kind==="mixup"){session={mix:true,i:0,q:mixQ()};shown=false;return render();}
  else if(kind.startsWith("row:")){
    const r=kind.slice(4);
    q=DECKS.filter(c=>(c.deck==="kana"||c.deck==="hira")&&c.row===r);
    for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  }
  else if(kind.startsWith("u:")){
    const u=UNITS.find(x=>x.i===kind.slice(2));q=u.ids.map(id=>DECKS.find(c=>c.id===id));
  }else{
    const pool={kana:["kana"],hira:["hira"],listen:["listen"],vocab:["vocab"],gram:["gram"],num:["num"],kanji:["kanji"],vocab4:["vocab4"],gram4:["gram4"],phrase:["phrase"],loan:["loan"]}[kind];
    q=DECKS.filter(c=>pool.includes(c.deck)&&(isDue(c.id)||!seen(c.id)));
    if(!q.length)q=DECKS.filter(c=>pool.includes(c.deck)).slice(0,20);
    for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
    q=q.slice(0,25);
  }
  if(!q||!q.length)return;
  session={q,i:0,n:q.length};shown=false;pick=null;curOpts=null;undoSnap=null;played=0;taught=false;render();
}
function mixQ(){
  const map={};
  KANA.concat(KANA_D,KANA_Y).forEach(k=>{map[k[0]]=k[2];map[k[1]]=k[2];});
  const items=[];
  MIXUP.forEach(m=>[m[0],m[1]].forEach(ch=>{
    if(map[ch])items.push({ch,ans:map[ch],opts:[m[0],m[1]].map(x=>map[x]||x),tip:m[2]});}));
  for(let i=items.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[items[i],items[j]]=[items[j],items[i]];}
  return items.slice(0,16);
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeOpts(c){
  if(c.opts&&c.opts.length>1)return shuf(c.opts.slice());
  const used=new Set([c.back]),pool=[];
  (BY[c.deck]||[]).forEach(x=>{if(!used.has(x.back)){used.add(x.back);pool.push(x.back);}});
  return shuf([c.back].concat(shuf(pool).slice(0,3)));
}
const TIP={kana:"在心裡唸出這個音",hira:"在心裡唸出這個音",listen:"先聽，再想是什麼意思",num:"把讀音唸出來",kanji:"先想意思，再想音読み和訓読み",
 loan:"唸出來，再想是什麼意思",vocab:"唸出日文，再想中文意思",vocab4:"唸出日文，再想中文意思",
 gram:"想出正確的形式",gram4:"想出正確的形式",phrase:"出聲把整句日文講出來"};

function drawStudy(){
  navEl.innerHTML="";
  if(session.mix)return drawMix();
  if(session.i>=session.q.length){
    app.innerHTML=`<div class="study"><div class="face"><div class="mid">終わりました</div>
    <div class="hint">完成 ${session.n} 張 · 今日累計 ${S.day.newN+S.day.revN} 張</div></div>
    <button class="cta" id="bk">回到今日</button></div>`;
    document.getElementById("bk").onclick=()=>{session=null;render();};return;
  }
  const c=session.q[session.i],isNew=!seen(c.id);
  const label={kana:"片假名",hira:"平假名",listen:"聽力",num:"數字量詞",loan:"外來語",vocab:"N5 單字",gram:"N5 文法",
    kanji:"N5 漢字",vocab4:"N4 單字",gram4:"N4 文法",phrase:"課程會話"}[c.deck];
  const fc=(c.deck==="kana"||c.deck==="hira"||c.deck==="kanji")?"big jp":
    ((c.deck==="gram"||c.deck==="gram4")?"small jp":(c.deck==="phrase"?"small":"mid jp"));
  const teachNow=isNew&&c.gram&&!taught;
  if(isNew&&!curOpts)curOpts=makeOpts(c);
  if(c.audio&&!shown&&!played){played=1;setTimeout(()=>say(c.speak),200);}
  const tip=teachNow?"文法是規則，沒學過猜不出來。先看懂再作答"
    :(shown?"想不出來就按「不會」。評分誠實，排程才會準"
    :(isNew?(c.gram?"套用剛才看到的規則":"第一次見面，先猜猜看。選錯不扣分，這一步只是讓你有個印象")
           :(TIP[c.deck]||"先想出答案")+"，再看答案"));
  app.innerHTML=`<div class="study">
  <div class="qbar"><div>${label}${teachNow?" · 先學":(isNew?" · 新卡":"　複習")}</div><div>${session.i+1} / ${session.q.length}</div></div>
  <div class="face" style="${teachNow?"align-items:stretch;justify-content:flex-start;text-align:left":""}">
    ${teachNow?`
      <div class="mid jp" style="font-size:22px;margin-bottom:8px">${esc(c.gram.p)}</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">${esc(c.gram.n)}</div>
      ${c.gram.ex.map(e=>`<div style="border-left:2px solid var(--ruleS);padding-left:11px;margin-top:12px">
        ${sentence(e[0],null)}
        <div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(e[1])}</div></div>`).join("")}
    `:c.audio&&!shown
      ? `<button class="spk" data-say="${esc(c.speak)}" style="font-size:26px;padding:26px 40px;border-radius:99px">▶</button>
         <button class="spk" data-slow="${esc(c.speak)}" style="margin-top:12px">▶ 放慢再聽</button>`
      : `<div class="${fc}">${esc(c.front)}</div>`}
    ${shown?`<div class="ans">
      <div class="${(c.deck==="kana"||c.deck==="hira")?"romaji":"mid jp"}">${esc(c.back)}</div>
      ${c.sub?`<div class="hint jp" style="font-size:17px">${esc(c.sub)}</div>`:""}
      ${c.extra?`<div class="hint">${esc(c.extra)}</div>`:""}
      ${(c.gram&&c.speak)?`<div style="border-top:1px solid var(--rule);margin-top:14px;padding-top:12px;text-align:left;width:100%">
        ${sentence(c.speak,c.fp)}</div>`:""}
      ${c.gram?`<div style="border-top:1px solid var(--rule);margin-top:12px;padding-top:12px;text-align:left;width:100%">
        ${c.gram.ex.map(e=>`<div style="margin-bottom:14px">${sentence(e[0],null)}
          <div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(e[1])}</div></div>`).join("")}</div>`:""}
      ${(()=>{
        const jp=(c.deck==="phrase")?c.back:(c.deck==="listen"?c.sub:null);
        if(!jp)return "";
        const ch=chips(jp);
        return ch?`<div style="border-top:1px solid var(--rule);margin-top:14px;padding-top:12px;text-align:left;width:100%">${ch}</div>`:"";
      })()}
      ${(()=>{
        if(!["vocab","vocab4","loan"].includes(c.deck))return "";
        const e=EXAMPLE[c.front];
        if(!e)return "";
        return `<div style="border-top:1px solid var(--rule);margin-top:14px;padding-top:12px;text-align:left;width:100%">
          ${sentence(e.jp,null)}
          <div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(e.zh)}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:2px">${esc(e.unit)}</div></div>`;})()}
      ${isNew&&pick!==null&&pick!==c.back?`<div class="hint" style="color:var(--seal)">你選了「${esc(pick)}」</div>`:""}
      ${c.speak?`<div style="display:flex;gap:8px;justify-content:center">
        <button class="spk" data-say="${esc(c.speak)}">▸ 聽發音</button>
        <button class="spk" data-slow="${esc(c.speak)}">▸ 更慢</button></div>`:""}</div>`:""}
  </div>
  <div class="tip">${tip}</div>
  ${teachNow?`<button class="reveal" id="taught">懂了，來測驗</button>`
   :(shown?`<div class="grades"><button class="g0" data-g="0">不會</button>
     <button class="g1" data-g="1">模糊</button><button class="g2" data-g="2">會了</button></div>`
   :(isNew?`<div class="opts">${curOpts.map(o=>
      `<button data-opt="${esc(o)}" class="jp">${esc(o)}</button>`).join("")}</div>`
     :`<button class="reveal" id="rv">顯示答案</button>`))}
  <div style="display:flex;gap:8px;margin-top:8px">
    ${undoSnap?`<button class="cta2" id="undo" style="margin:0;flex:1">↶ 上一張</button>`:""}
    <button class="cta2" id="quit" style="margin:0;flex:1">結束這輪</button></div></div>`;
  bind();
  const tg=document.getElementById("taught");
  if(tg)tg.onclick=()=>{taught=true;drawStudy();};
  const rv=document.getElementById("rv");
  if(rv)rv.onclick=()=>{shown=true;drawStudy();if(c.speak)say(c.speak);};
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    pick=b.dataset.opt;shown=true;drawStudy();if(c.speak)say(c.speak);});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const wasNew=!seen(c.id);
    const prev=S.cards[c.id]?JSON.parse(JSON.stringify(S.cards[c.id])):null;
    const snap={id:c.id,prev,wasNew,i:session.i,total:S.total,last:S.last,pick,opts:curOpts};
    const again=grade(c.id,+b.dataset.g);
    if(wasNew)S.day.newN++;else S.day.revN++;
    snap.again=again; if(again)session.q.push(c);
    undoSnap=snap;
    session.i++;shown=false;pick=null;curOpts=null;played=0;taught=false;drawStudy();});
  const ud=document.getElementById("undo");
  if(ud)ud.onclick=()=>{
    const u=undoSnap;if(!u)return;
    if(u.prev)S.cards[u.id]=u.prev;else delete S.cards[u.id];
    if(u.wasNew)S.day.newN=Math.max(0,S.day.newN-1);else S.day.revN=Math.max(0,S.day.revN-1);
    S.total=u.total;S.last=u.last;
    if(u.again&&session.q[session.q.length-1]&&session.q[session.q.length-1].id===u.id)session.q.pop();
    session.i=u.i;shown=true;pick=u.pick;curOpts=u.opts;played=1;
    undoSnap=null;save();drawStudy();};
  document.getElementById("quit").onclick=()=>{session=null;render();};
}
function drawMix(){
  if(session.i>=session.q.length){
    app.innerHTML=`<div class="study"><div class="face"><div class="mid">お疲れさま</div>
    <div class="hint">易混字 ${session.q.length} 題完成</div></div><button class="cta" id="bk">回到今日</button></div>`;
    document.getElementById("bk").onclick=()=>{session=null;render();};return;}
  const it=session.q[session.i];
  app.innerHTML=`<div class="study">
  <div class="qbar"><div>易混字挑戰</div><div>${session.i+1} / ${session.q.length}</div></div>
  <div class="face"><div class="big jp">${it.ch}</div>
  ${shown?`<div class="ans"><div class="romaji">${it.ans}</div><div class="hint">${it.tip}</div>
   <div style="display:flex;gap:8px;justify-content:center">
   <button class="spk" data-say="${it.ch}">▸ 聽發音</button>
   <button class="spk" data-slow="${it.ch}">▸ 更慢</button></div></div>`:""}</div>
  <div class="grades" style="grid-template-columns:1fr 1fr">
  ${it.opts.map(o=>`<button class="${shown?(o===it.ans?"g2":"g0"):"g1"}" data-o="${o}">${o}</button>`).join("")}</div>
  <button class="cta2" id="quit">結束這輪</button></div>`;
  bind();
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(shown){shown=false;session.i++;}
    else{shown=true;say(it.ch);if(b.dataset.o!==it.ans)session.q.push(it);}
    drawMix();});
  document.getElementById("quit").onclick=()=>{session=null;render();};
}
